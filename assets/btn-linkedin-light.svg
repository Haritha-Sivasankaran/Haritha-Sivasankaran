<svg xmlns="http://www.w3.org/2000/svg" width="330" height="54" viewBox="0 0 330 54" role="img" aria-label="Connect on LinkedIn">
  <title>Connect on LinkedIn</title>
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .cursor { animation: blink 1.05s steps(1) infinite; }
    .arrow { animation: nudge 2.6s ease-in-out infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    @keyframes nudge { 0%,65%,100% { transform: translate(0,0); } 78% { transform: translate(3px,-3px); } }
    @media (prefers-reduced-motion: reduce) { .cursor, .arrow { animation: none; } }
  </style>
