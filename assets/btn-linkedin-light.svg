      <stop offset="1" stop-color="#d0d7de"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="0 0;490 0;490 0" keyTimes="0;0.55;1" dur="3.6s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="328" height="52" rx="12" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="1" y="1" width="328" height="52" rx="12" fill="none" stroke="url(#shine)" stroke-width="1.5"/>
