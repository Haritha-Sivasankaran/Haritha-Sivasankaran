  <line x1="26.5" y1="88.5" x2="30" y2="92" stroke="#6E7681" stroke-width="1.5" stroke-linecap="round" />
  <!-- Source Control with Badge -->
  <circle cx="21" cy="116" r="2.5" fill="none" stroke="#6E7681" stroke-width="1.5" />
  <circle cx="26" cy="122" r="2.5" fill="none" stroke="#6E7681" stroke-width="1.5" />
  <path d="M 21 118.5 L 21 126 M 21 123.5 L 23.5 122" fill="none" stroke="#6E7681" stroke-width="1.5" />
  <circle cx="31" cy="113" r="3" fill="#38BDF8" />
