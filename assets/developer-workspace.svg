  <!-- Syntax-Highlighted Code Lines -->
  <g class="code-font" transform="translate(104, 0)">
    <!-- Line 1 -->
    <text x="0" y="112">
      <tspan class="kw">import</tspan> <tspan class="punc">{</tspan> <tspan class="type">FullStackEngineer</tspan><tspan class="punc">, </tspan><tspan class="type">DistributedSystems</tspan> <tspan class="punc">} </tspan><tspan class="kw">from</tspan> <tspan class="str">"@haritha/architecture"</tspan><tspan class="punc">;</tspan>
    </text>

    <!-- Line 2: Comment -->
    <text x="0" y="131">
      <tspan class="comm">// High-throughput event streaming, distributed pipelines &amp; modern interfaces</tspan>
    </text>

    <!-- Line 3: Object Declaration -->
    <text x="0" y="150">
      <tspan class="kw">export const</tspan> <tspan class="fn">haritha</tspan><tspan class="punc">: </tspan><tspan class="type">FullStackEngineer</tspan> <tspan class="punc">= {</tspan>
    </text>

    <!-- Line 4 -->
    <text x="16" y="169">
      <tspan class="prop">name</tspan><tspan class="punc">: </tspan><tspan class="str">"Haritha Sivasankaran"</tspan><tspan class="punc">,</tspan>
    </text>

    <!-- Line 5 -->
    <text x="16" y="188">
      <tspan class="prop">role</tspan><tspan class="punc">: </tspan><tspan class="str">"Full-Stack Software Engineer"</tspan><tspan class="punc">,</tspan>
    </text>

    <!-- Line 6: Core Languages -->
    <text x="16" y="207">
      <tspan class="prop">languages</tspan><tspan class="punc">: [</tspan><tspan class="str">"TypeScript"</tspan><tspan class="punc">, </tspan><tspan class="str">"Java"</tspan><tspan class="punc">, </tspan><tspan class="str">"Python"</tspan><tspan class="punc">, </tspan><tspan class="str">"JavaScript"</tspan><tspan class="punc">, </tspan><tspan class="str">"SQL"</tspan><tspan class="punc">],</tspan>
    </text>

    <!-- Line 7: Frontend Stack -->
    <text x="16" y="226">
      <tspan class="prop">frontend</tspan><tspan class="punc">: [</tspan><tspan class="str">"React"</tspan><tspan class="punc">, </tspan><tspan class="str">"Next.js"</tspan><tspan class="punc">, </tspan><tspan class="str">"TailwindCSS"</tspan><tspan class="punc">, </tspan><tspan class="str">"Svelte"</tspan><tspan class="punc">, </tspan><tspan class="str">"Vue.js"</tspan><tspan class="punc">],</tspan>
    </text>

    <!-- Line 8: Backend & AI -->
    <text x="16" y="245">
      <tspan class="prop">backend</tspan><tspan class="punc">: [</tspan><tspan class="str">"Spring Boot"</tspan><tspan class="punc">, </tspan><tspan class="str">"Spring AI"</tspan><tspan class="punc">, </tspan><tspan class="str">"Node.js"</tspan><tspan class="punc">, </tspan><tspan class="str">"Express.js"</tspan><tspan class="punc">, </tspan><tspan class="str">"REST APIs"</tspan><tspan class="punc">],</tspan>
    </text>

    <!-- Line 9: Messaging & Streams -->
    <text x="16" y="264">
      <tspan class="prop">messaging</tspan><tspan class="punc">: [</tspan><tspan class="str">"Apache Kafka"</tspan><tspan class="punc">, </tspan><tspan class="str">"RabbitMQ"</tspan><tspan class="punc">, </tspan><tspan class="str">"WebSockets"</tspan><tspan class="punc">],</tspan>
    </text>

    <!-- Line 10: Databases & DevOps -->
    <text x="16" y="283">
      <tspan class="prop">infrastructure</tspan><tspan class="punc">: [</tspan><tspan class="str">"Docker"</tspan><tspan class="punc">, </tspan><tspan class="str">"PostgreSQL"</tspan><tspan class="punc">, </tspan><tspan class="str">"MongoDB"</tspan><tspan class="punc">, </tspan><tspan class="str">"GitHub Actions"</tspan><tspan class="punc">, </tspan><tspan class="str">"Linux"</tspan><tspan class="punc">],</tspan>
    </text>

    <!-- Line 11: Focus -->
    <text x="16" y="302">
      <tspan class="prop">focus</tspan><tspan class="punc">: </tspan><tspan class="str">"Building resilient distributed systems &amp; responsive web platforms"</tspan><tspan class="punc">,</tspan>
    </text>

    <!-- Line 12: Status with Blinking Cursor -->
    <text x="16" y="321">
      <tspan class="prop">availableForShipping</tspan><tspan class="punc">: </tspan><tspan class="bool">true</tspan>
    </text>
    <!-- Blinking Cursor -->
    <rect x="188" y="309" width="2" height="15" fill="#38BDF8" class="cursor" />

    <!-- Line 13: Closing bracket -->
    <text x="0" y="340">
      <tspan class="punc">};</tspan>
    </text>
  </g>

