<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 540" width="920" height="540">
  <defs>
    <!-- Background Linear Gradient -->
    <linearGradient id="windowBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0E1117" />
      <stop offset="100%" stop-color="#080A0E" />
    </linearGradient>

    <!-- Glowing Accents -->
    <filter id="tabGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&amp;family=Inter:wght@400;500;600;700&amp;display=swap');

      .code-font {
        font-family: 'JetBrains Mono', 'Fira Code', 'SF Mono', Consolas, monospace;
        font-size: 12px;
        line-height: 18px;
      }
      .ui-font {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        font-size: 11px;
      }

      /* Syntax Highlighting */
      .kw { fill: #FF7B72; font-weight: 600; }        /* Keywords (import, export, const) */
      .mod { fill: #FFA657; }                        /* Modules / Packages */
      .str { fill: #A5D6FF; }                        /* Strings */
      .prop { fill: #7EE787; }                       /* Object properties */
      .type { fill: #79C0FF; font-weight: 600; }      /* Types / Interfaces */
      .num { fill: #D2A8FF; }                        /* Numbers */
      .bool { fill: #FF7B72; font-weight: 600; }     /* Boolean */
      .comm { fill: #8B949E; font-style: italic; }   /* Comments */
      .punc { fill: #C9D1D9; }                       /* Brackets / Punctuation */
      .fn { fill: #D2A8FF; font-weight: 600; }       /* Functions */

      /* Blinking Cursor Animation */
      .cursor {
        animation: cursorBlink 1s infinite step-start;
      }
      @keyframes cursorBlink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }

      /* Pulsing Dot Animation */
      .status-pulse {
        animation: pulseDot 2s infinite ease-in-out;
      }
      @keyframes pulseDot {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.4; transform: scale(0.85); }
      }
    </style>
  </defs>

  <!-- Window Frame -->
  <rect width="920" height="540" rx="12" fill="url(#windowBg)" stroke="#30363D" stroke-width="1.5" />

  <!-- Window Title Bar -->
  <rect width="920" height="36" rx="12" fill="#161B22" />
  <rect y="24" width="920" height="12" fill="#161B22" />
  <line x1="0" y1="36" x2="920" y2="36" stroke="#21262D" stroke-width="1" />

  <!-- Window Controls (macOS Dots) -->
  <circle cx="20" cy="18" r="5.5" fill="#EC6A5E" />
  <circle cx="38" cy="18" r="5.5" fill="#F4BF4F" />
  <circle cx="56" cy="18" r="5.5" fill="#61C554" />

  <!-- Window Title Center -->
  <text x="460" y="22" fill="#8B949E" text-anchor="middle" class="ui-font" font-weight="500">
    Haritha Sivasankaran — Code Workspace [Visual Studio Code]
  </text>

  <!-- Left Activity Bar -->
  <rect y="36" width="46" height="480" fill="#0D1117" />
