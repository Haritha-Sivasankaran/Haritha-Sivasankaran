  <rect x="25" y="146" width="5" height="5" fill="#6E7681" />
  <rect x="18" y="153" width="5" height="5" fill="#6E7681" />
  <!-- Settings Bottom Gear -->
  <circle cx="23" cy="496" r="3.5" fill="none" stroke="#6E7681" stroke-width="1.5" />
  <path d="M 23 490 L 23 502 M 17 496 L 29 496" stroke="#6E7681" stroke-width="1.2" />

  <!-- Tabs Bar -->
  <rect x="46" y="36" width="874" height="34" fill="#0D1117" />
  <line x1="46" y1="70" x2="920" y2="70" stroke="#21262D" stroke-width="1" />

  <!-- Tab 1: engineer.ts (Active Tab) -->
  <rect x="46" y="36" width="165" height="34" fill="#161B22" />
  <line x1="46" y1="36" x2="211" y2="36" stroke="#38BDF8" stroke-width="2.5" />
  <rect x="58" y="47" width="13" height="13" rx="2" fill="#3178C6" />
  <text x="64.5" y="57" font-size="8.5" font-weight="700" fill="#FFFFFF" text-anchor="middle" font-family="monospace">TS</text>
  <text x="78" y="58" fill="#E6EDF3" class="ui-font" font-weight="600">engineer.ts</text>
  <text x="195" y="57" fill="#6E7681" class="ui-font" font-size="12">×</text>
  <line x1="211" y1="42" x2="211" y2="64" stroke="#21262D" stroke-width="1" />

  <!-- Breadcrumb Bar -->
  <rect x="46" y="70" width="874" height="22" fill="#10151C" />
  <line x1="46" y1="92" x2="920" y2="92" stroke="#21262D" stroke-width="1" />
  <text x="60" y="85" fill="#6E7681" class="ui-font" font-size="10">
    portfolio <tspan fill="#484F58">&gt;</tspan> src <tspan fill="#484F58">&gt;</tspan> systems <tspan fill="#484F58">&gt;</tspan> <tspan fill="#8B949E">engineer.ts</tspan> <tspan fill="#484F58">&gt;</tspan> <tspan fill="#79C0FF">HarithaProfile</tspan>
  </text>

  <!-- Code Editor Body -->
